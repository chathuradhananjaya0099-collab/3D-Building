<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Office 3D Model</title>
<style>
:root{--bg:#dfe5ec;--fg:#1f2937;--card:#ffffff;--line:#c5ccd6;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1f27;--fg:#e5e7eb;--card:#2a303b;--line:#3b4352}}
:root[data-theme="dark"]{--bg:#1b1f27;--fg:#e5e7eb;--card:#2a303b;--line:#3b4352}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#bar{position:absolute;left:12px;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 24px)}
button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer}
button:hover{border-color:#4472c4}
#hint{position:absolute;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);font-size:12px;opacity:.7}
</style></head><body>
<canvas id="c"></canvas>
<div id="bar">
<button id="b1">Perspective</button><button id="b2">Top view</button>
<button id="b3">Cutaway walls</button><button id="b5">Measurements</button><button id="b4">Auto-rotate</button>
</div>
<div id="hint">Drag to rotate · scroll or pinch to zoom · not to scale</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const cv=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
R.outputEncoding=THREE.sRGBEncoding;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.05;
const scene=new THREE.Scene();
const dark=matchMedia('(prefers-color-scheme: dark)').matches;
scene.background=new THREE.Color(dark?0x1b1f27:0xdfe5ec);
const cam=new THREE.PerspectiveCamera(40,1,0.5,500);
const ctl=new THREE.OrbitControls(cam,cv);ctl.enableDamping=true;ctl.maxPolarAngle=Math.PI/2.02;
function setView(top){if(top){cam.position.set(0.01,95,0.01)}else{cam.position.set(-34,38,52)}ctl.target.set(0,0,0);ctl.update()}
setView(false);
scene.add(new THREE.HemisphereLight(0xffffff,0x8a8f9c,0.75));
const sun=new THREE.DirectionalLight(0xfff4e0,0.9);sun.position.set(-30,60,35);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-45,right:45,top:45,bottom:-45,near:1,far:150});sun.shadow.bias=-0.0005;scene.add(sun);

const S=1/11,OX=451,OZ=278,X=x=>(x-OX)*S,Z=y=>(y-OZ)*S;
const std=(c,r=0.7,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
function B(x0,y0,x1,y1,h,mat,y=0,par=scene){const m=new THREE.Mesh(new THREE.BoxGeometry((x1-x0)*S,h,(y1-y0)*S),mat);
m.position.set(X((x0+x1)/2),y+h/2,Z((y0+y1)/2));m.castShadow=true;m.receiveShadow=true;par.add(m);return m}
function wood(c1,c2,w,d){const k=document.createElement('canvas');k.width=k.height=256;const g=k.getContext('2d');
for(let i=0;i<8;i++){g.fillStyle=i%2?c1:c2;g.fillRect(0,i*32,256,32);g.fillStyle='rgba(0,0,0,.18)';g.fillRect(0,i*32,256,1);
g.fillRect((i*83)%256,i*32,1,32)}
const t=new THREE.CanvasTexture(k);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(w*S/8,d*S/8);t.encoding=THREE.sRGBEncoding;
return new THREE.MeshStandardMaterial({map:t,roughness:0.55})}
function carpet(c,w,d){const k=document.createElement('canvas');k.width=k.height=64;const g=k.getContext('2d');g.fillStyle=c;g.fillRect(0,0,64,64);
for(let i=0;i<500;i++){g.fillStyle=`rgba(${Math.random()<.5?255:0},${Math.random()<.5?255:0},${Math.random()<.5?255:0},.05)`;g.fillRect(Math.random()*64,Math.random()*64,1,1)}
const t=new THREE.CanvasTexture(k);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(w*S/3,d*S/3);t.encoding=THREE.sRGBEncoding;
return new THREE.MeshStandardMaterial({map:t,roughness:1})}

// ground + floors
const gr=new THREE.Mesh(new THREE.PlaneGeometry(400,400),std(dark?0x262b35:0xcfd6df,1));gr.rotation.x=-Math.PI/2;gr.position.y=-0.32;gr.receiveShadow=true;scene.add(gr);
const fl=(a,b,c,d,m)=>B(a,b,c,d,0.3,m,-0.3);
fl(306,43,597,117,carpet('#6f7f93',291,74));
fl(306,117,597,310,wood('#b98a5a','#c4966a',291,193));
fl(380,310,597,373,wood('#d9c7a8','#e0cfb2',217,63));
fl(380,373,597,452,carpet('#7b8088',217,79));
fl(380,452,597,513,wood('#b98a5a','#c4966a',217,61));
fl(306,165,380,310,carpet('#9aa3ad',74,145));
B(578,318,594,372,3,std(0xe8a46f,0.6),0);B(577,317,595,373,0.2,std(0x2d2f33,0.4),3);B(584,318,595,372,2.2,std(0xe8a46f,0.6),5.2);

// walls
const wm=std(0xf2f0eb,0.9),dm=std(0x8b5a2b,0.6),WH=9,wallG=new THREE.Group();scene.add(wallG);
function W(x0,y0,x1,y1,dr=[]){const t=2.5,hz=y0===y1;let c=(hz?x0:y0)-t;const e=(hz?x1:y1)+t;
const seg=(p,q,h=WH,y=0)=>{if(q-p<=0)return;hz?B(p,y0-t,q,y0+t,h,wm,y,wallG):B(x0-t,p,x0+t,q,h,wm,y,wallG)};
dr.forEach(([a,b,o=1.2])=>{seg(c,a);seg(a,b,WH-7,7);const g=new THREE.Group();g.position.set(X(hz?a:x0),0,Z(hz?y0:a));g.rotation.y=(hz?0:-Math.PI/2)+o;
const w=(b-a)*S,lf=new THREE.Mesh(new THREE.BoxGeometry(w,6.8,0.18),dm);lf.position.set(w/2,3.4,0);lf.castShadow=true;g.add(lf);
const k=new THREE.Mesh(new THREE.SphereGeometry(0.15,8,8),std(0xc9ced6,0.3,0.8));k.position.set(w-0.5,3.3,0.2);g.add(k);wallG.add(g);c=b});seg(c,e)}
[[306,43,597,43],[306,117,597,117,[[316,340],[408,432],[538,562]]],[306,165,380,165],[306,310,380,310],[380,245,428,245],[428,310,597,310],[428,373,597,373],[380,452,597,452,[[386,426,-1.2]]],[380,513,597,513],
[306,43,306,310],[597,43,597,513],[394,43,394,117],[487,43,487,117],[380,165,380,513,[[245,300]]],[428,245,428,373,[[314,334,-1.2]]],[380,310,428,310,[[385,423,1.0]]],[380,373,428,373,[[385,423,-1.0]]]].forEach(a=>W(...a));
const gm=new THREE.MeshPhysicalMaterial({color:0x8fb4e8,roughness:0.05,transmission:0,transparent:true,opacity:0.55,metalness:0.1});
const fm=std(0x3a3f4a,0.5);
function glassH(x0,x1,y){B(x0,y-3.2,x1,y+3.2,4.2,gm,3.2,wallG);B(x0,y-3.4,x1,y+3.4,0.25,fm,3.1,wallG);B(x0,y-3.4,x1,y+3.4,0.25,fm,7.4,wallG)}
function glassV(y0,y1,x){B(x-3.2,y0,x+3.2,y1,6,gm,1.8,wallG);B(x-3.4,y0,x+3.4,y1,0.25,fm,1.7,wallG);B(x-3.4,y0,x+3.4,y1,0.25,fm,7.8,wallG)}
glassH(358,390,117);glassH(449,481,117);glassH(492,524,117);glassH(306,340,165);glassH(315,345,310);
glassV(140,205,597);glassV(222,288,597);glassV(440,456,380);

// furniture
const deskM=std(0xe9e4da,0.5),legM=std(0x555b66,0.4,0.6),chM=std(0x2b2f36,0.7),scrM=std(0x0e1116,0.2,0.4),sofaM=std(0xb8bec6,0.95);
function desk(cx,cy,w,d,h=2.6){B(cx-w/2,cy-d/2,cx+w/2,cy+d/2,0.2,deskM,h-0.2);
[[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a,b])=>B(cx+a*(w/2-2)-.8,cy+b*(d/2-2)-.8,cx+a*(w/2-2)+.8,cy+b*(d/2-2)+.8,h-0.2,legM))}
function mon(cx,cy,rot=0){const g=new THREE.Group();g.position.set(X(cx),2.6,Z(cy));g.rotation.y=rot;
const s=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.9,0.08),scrM);s.position.y=0.95;s.castShadow=true;g.add(s);
const p=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.5,0.12),legM);p.position.y=0.5;g.add(p);scene.add(g)}
function chair(cx,cy,th,s=1,cm=chM){const g=new THREE.Group();g.position.set(X(cx),0,Z(cy));g.rotation.y=th;g.scale.setScalar(s);
const add=(geo,m,x,y,z)=>{const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;g.add(o)};
add(new THREE.BoxGeometry(1.5,0.25,1.5),cm,0,1.5,0);add(new THREE.BoxGeometry(1.5,1.7,0.2),cm,0,2.45,0.75);
add(new THREE.CylinderGeometry(0.1,0.1,1.2,8),legM,0,0.85,0);add(new THREE.CylinderGeometry(0.75,0.75,0.12,12),legM,0,0.15,0);scene.add(g)}
const toward=(cx,cy,tx,ty)=>Math.atan2(-(tx-cx),-(ty-cy));
const ch=(cx,cy,tx,ty,s=1,m)=>chair(cx,cy,toward(cx,cy,tx,ty),s,m);

// offices
desk(329,77,20,28);ch(313,77,329,77);mon(329,77,-Math.PI/2);
desk(365,58,36,16);ch(365,73,365,58);mon(365,56);
desk(418,76,16,30);ch(404,76,418,76);mon(418,76,-Math.PI/2);
desk(456,57,44,16);desk(441,77,14,24);ch(458,80,458,57);ch(474,80,474,57);mon(456,57,Math.PI);
desk(564,78,22,56);desk(550,50,22,16);ch(535,68,564,68);ch(535,92,564,92);mon(566,62,-Math.PI/2);
// open area cluster
B(528.5,143,531.5,227,3.2,std(0x9aa3ad,0.8),0);B(490,183.5,570,186.5,3.2,std(0x9aa3ad,0.8),0);
[[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a,b])=>{desk(530+a*20,185+b*9,36,14,2.5);desk(530+a*9,185+b*28,14,24,2.5);ch(530+a*33,185+b*33,530,185);mon(530+a*26,185+b*9,Math.atan2(a,b))});
// two-person desks
desk(441,225,20,35);desk(441,263,20,35);ch(456,225,441,225);ch(456,263,441,263);mon(437,225,Math.PI/2);mon(437,263,Math.PI/2);
desk(537,281,86,22);ch(518,267,518,281);ch(560,267,560,281);mon(518,285,Math.PI);mon(560,285,Math.PI);
// sofa room
B(350,178,372,300,1.5,sofaM,0.3);B(332,278,372,300,1.5,sofaM,0.3);B(370,178,376,300,3.4,sofaM,0.3);B(332,298,376,304,3.4,sofaM,0.3);
B(312,212,346,264,0.06,std(0x8a6d5a,1),0);B(318,224,340,254,0.2,gm,1.5);[[318,224],[336,224],[318,250],[336,250]].forEach(([x,y])=>B(x,y,x+4,y+4,1.5,legM));
// meeting room F
[494,546].forEach(x=>{const y=346;desk(x,y,32,20);[-8,8].forEach(d=>{ch(x+d,y-17,x+d,y,.8);ch(x+d,y+17,x+d,y,.8)});ch(x-24,y,x,y,.8);ch(x+24,y,x,y,.8)});
[[438,338],[438,351],[438,364],[452,338],[452,351],[452,364]].forEach(([x,y])=>ch(x,y,480,y,.8));
// conference G
B(463,394,542,428,0.3,std(0x6b4423,0.4),2.5);B(480,400,490,422,2.5,legM);B(515,400,525,422,2.5,legM);
const cb=std(0x3d5a80,0.7);[474,490,506,522].forEach(x=>{ch(x,386,x,411,1,cb);ch(x,436,x,411,1,cb)});
ch(454,411,480,411,1,cb);ch(551,411,525,411,1,cb);

// labels
function label(t,x,y){const k=document.createElement('canvas');k.width=k.height=128;const g=k.getContext('2d');
g.fillStyle='rgba(255,255,255,.9)';g.beginPath();g.arc(64,64,48,0,7);g.fill();g.fillStyle='#2f6b2f';g.font='bold 64px system-ui,Arial';g.textAlign='center';g.textBaseline='middle';g.fillText(t,64,68);
const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(k),depthTest:false}));s.scale.set(2.6,2.6,1);s.position.set(X(x),0.9,Z(y));s.renderOrder=9;scene.add(s)}
[['A',352,100],['B',409,105],['C',512,100],['D',343,172],['E',407,200],['F',463,340],['G',575,420],['H',500,485]].forEach(a=>label(...a));

const dimG=new THREE.Group();scene.add(dimG);const dc=std(0x2f6fd0,0.5);
function dim(x0,y0,x1,y1,t){const hz=y0===y1;B(x0-(hz?0:.6),y0-(hz?.6:0),x1+(hz?0:.6),y1+(hz?.6:0),0.1,dc,0.02,dimG);
[[x0,y0],[x1,y1]].forEach(([x,y])=>B(hz?x-.6:x-4,hz?y-4:y-.6,hz?x+.6:x+4,hz?y+4:y+.6,0.1,dc,0.02,dimG));
const k=document.createElement('canvas');k.width=256;k.height=96;const g=k.getContext('2d');g.fillStyle='rgba(255,255,255,.92)';g.fillRect(8,12,240,72);
g.fillStyle='#b36b00';g.font='bold 48px system-ui,Arial';g.textAlign='center';g.textBaseline='middle';g.fillText(t,128,50);
const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(k),depthTest:false}));s.scale.set(4.2,1.6,1);s.position.set(X((x0+x1)/2),0.9,Z((y0+y1)/2));s.renderOrder=10;dimG.add(s)}
[[306,34,394,34,'7′ 6″'],[394,34,487,34,'8.6′'],[298,43,298,117,'10′ 7″'],[342,117,342,165,'7′'],[607,117,607,305,'16′'],[430,303,597,303,'15′'],[607,310,607,373,'10′ 3″'],[306,322,380,322,'4′ 7″'],[424,245,424,305,'6′'],[440,369,575,369,'12′ 20″']].forEach(a=>dim(...a));
// ui
let cut=false;
b1.onclick=()=>setView(false);b2.onclick=()=>setView(true);
b3.onclick=()=>{cut=!cut;wallG.scale.y=cut?0.28:1;wallG.children.forEach(m=>{m.position.y=m.userData.y0*(cut?0.28:1)})};
wallG.children.forEach(m=>m.userData.y0=m.position.y);
b4.onclick=()=>{ctl.autoRotate=!ctl.autoRotate;ctl.autoRotateSpeed=1.2};
b5.onclick=()=>{dimG.visible=!dimG.visible};
function rs(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();
(function loop(){requestAnimationFrame(loop);ctl.update();R.render(scene,cam)})();
</script></body></html>
